<!DOCTYPE html>
<html>
<head>

<title>Customer Registration</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:#f2f2f2;
}

.container{
width:400px;
margin:60px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0px 0px 15px gray;
}

h2{
text-align:center;
color:#333;
margin-bottom:25px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
margin-bottom:5px;
}

input[type="text"]{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

input[type="submit"]{
width:100%;
padding:12px;
margin-top:25px;
background:#4CAF50;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

input[type="submit"]:hover{
background:#45a049;
}

</style>

</head>

<body>

<div class="container">

<h2>Customer Registration</h2>

<form action="CustomerServlet" method="post">

<label>Customer Id</label>
<input type="text" name="cid">

<label>Customer Name</label>
<input type="text" name="cname">

<label>Phone Number</label>
<input type="text" name="phone">

<input type="submit" value="Register Customer">

</form>

</div>

</body>
</html>
